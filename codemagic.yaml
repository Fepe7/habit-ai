workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Habit-ai

    environment:
      vars:
        BUNDLE_ID: "com.andreistaicu.habitai"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Instalar pods iOS
        script: cd ios && pod install --repo-update

      - name: Crear certificado y perfil de firma
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
