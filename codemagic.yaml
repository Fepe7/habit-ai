workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Habit-ai

    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.andreistaicu.habitai"
        APP_STORE_APP_ID: "6777939075"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Instalar pods iOS
        script: cd ios && pod install --repo-update

      - name: Crear certificado y perfil de firma
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

      - name: Compilar Flutter sin firmar
        script: |
          # Número de build automático: último en App Store Connect + 1
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          BUILD_NUMBER=$(($LATEST + 1))
          echo "Compilando con build number $BUILD_NUMBER"
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

      - name: Archivar y firmar IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
