workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Habit-ai

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.andreistaicu.habitai

      vars:
        CM_CERTIFICATE: habitai-distribution
        CM_PROVISIONING_PROFILE: habitai-appstore

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias Flutter
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Instalar pods iOS
        script: cd ios && pod install --repo-update

      - name: Compilar IPA
        script: |
          flutter build ipa \
            --release \
            --no-tree-shake-icons \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
